<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Sketch Studio Pro - Focus View Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f8fafc; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; outline: none; }
        .no-select { user-select: none; -webkit-user-select: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #6366f1; cursor: pointer; border-radius: 50%; }
        .color-input-wrapper { position: relative; width: 100%; height: 36px; border-radius: 8px; overflow: hidden; border: 2px solid #e2e8f0; transition: transform 0.2s; }
        .color-input-wrapper:hover { transform: scale(1.02); }
        .color-input-wrapper input[type="color"] { position: absolute; top: -5px; left: -5px; width: calc(100% + 10px); height: calc(100% + 10px); cursor: pointer; border: none; background: none; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 3s linear infinite; }
        
        /* ハンバーガーメニューのアニメーション用カスタムCSS */
        .menu-icon span { display: block; position: absolute; height: 2px; width: 100%; background: #0f172a; border-radius: 9px; opacity: 1; left: 0; transform: rotate(0deg); transition: .25s ease-in-out; }
        .menu-icon span:nth-child(1) { top: 4px; }
        .menu-icon span:nth-child(2) { top: 11px; }
        .menu-icon span:nth-child(3) { top: 18px; }
        .menu-icon.open span:nth-child(1) { top: 11px; transform: rotate(135deg); }
        .menu-icon.open span:nth-child(2) { opacity: 0; left: -20px; }
        .menu-icon.open span:nth-child(3) { top: 11px; transform: rotate(-135deg); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [color, setColor] = useState('#6366f1');
            const [brushSize, setBrushSize] = useState(0.12);
            const [brushType, setBrushType] = useState('tube'); // 'tube', 'pen', 'pencil'
            const [mode, setMode] = useState('draw');
            const [isDrawing, setIsDrawing] = useState(false);
            const [lineCount, setLineCount] = useState(0);
            const [showControls, setShowControls] = useState(true);

            const mountRef = useRef(null);
            const sceneRef = useRef(new THREE.Scene());
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const controlsRef = useRef(null);
            const drawingLinesRef = useRef([]);
            const strokesRef = useRef([]);
            const currentPathRef = useRef([]);
            const modeRef = useRef('draw');
            const brushTypeRef = useRef('tube');
            const drawingPlaneRef = useRef(null);

            useEffect(() => {
                if (window.innerWidth < 768) {
                    setShowControls(false); 
                }
            }, []);

            useEffect(() => {
                modeRef.current = mode;
                if (controlsRef.current) {
                    const isRotateMode = mode === 'rotate';
                    controlsRef.current.enabled = isRotateMode;
                    controlsRef.current.autoRotate = isRotateMode;
                    if (isRotateMode) {
                        updateOrbitTarget();
                    }
                    controlsRef.current.update();
                }
            }, [mode]);

            useEffect(() => {
                brushTypeRef.current = brushType;
            }, [brushType]);

            const updateOrbitTarget = () => {
                if (!controlsRef.current) return;
                if (drawingLinesRef.current.length === 0) {
                    controlsRef.current.target.set(0, 0, 0);
                    controlsRef.current.update();
                    return;
                }
                const box = new THREE.Box3();
                drawingLinesRef.current.forEach(line => box.expandByObject(line));
                const center = new THREE.Vector3();
                box.getCenter(center);
                controlsRef.current.target.copy(center);
                controlsRef.current.update();
            };

            useEffect(() => {
                const width = window.innerWidth, height = window.innerHeight;
                const scene = sceneRef.current;
                scene.background = new THREE.Color(0xf8fafc);
                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
                camera.position.set(12, 10, 15);
                cameraRef.current = camera;
                const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;
                scene.add(new THREE.AmbientLight(0xffffff, 0.7));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);
                scene.add(new THREE.GridHelper(40, 40, 0xccd6e0, 0xe2e8f0));
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }));
                scene.add(plane);
                drawingPlaneRef.current = plane;
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enabled = (modeRef.current === 'rotate');
                controls.autoRotate = (modeRef.current === 'rotate');

                controlsRef.current = controls;
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;

                const animate = () => {
                    requestAnimationFrame(animate);
                    if (controlsRef.current) controlsRef.current.update();
                    if (modeRef.current !== 'rotate' && cameraRef.current) {
                        plane.quaternion.copy(cameraRef.current.quaternion);
                        const offset = new THREE.Vector3(0, 0, -10).applyQuaternion(cameraRef.current.quaternion);
                        plane.position.copy(cameraRef.current.position).add(offset);
                    }
                    renderer.render(scene, camera);
                };
                animate();
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [mode, lineCount, color, brushType, showControls]);

            const getMouse3D = (event) => {
                const rect = rendererRef.current.domElement.getBoundingClientRect();
                const x = ((event.clientX - rect.left) / rect.width) * 2 - 1, y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera({ x, y }, cameraRef.current);
                const intersects = raycaster.intersectObject(drawingPlaneRef.current);
                return intersects.length > 0 ? intersects[0].point : null;
            };

            const createPenGeometry = (points, size) => {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(drawingPlaneRef.current.quaternion).normalize();

                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    const vLeft = new THREE.Vector3().copy(p).addScaledVector(right, -size);
                    const vRight = new THREE.Vector3().copy(p).addScaledVector(right, size);
                    vertices.push(vLeft.x, vLeft.y, vLeft.z);
                    vertices.push(vRight.x, vRight.y, vRight.z);
                }

                const indices = [];
                for (let i = 0; i < points.length - 1; i++) {
                    const next = i + 1;
                    indices.push(i * 2, i * 2 + 1, next * 2);
                    indices.push(i * 2 + 1, next * 2 + 1, next * 2);
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();
                return geometry;
            };

            const createPencilGeometry = (points) => {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                points.forEach(p => {
                    vertices.push(p.x, p.y, p.z);
                });
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                return geometry;
            };

            const executeFill = (clickPoint) => {
                const lineStrokes = strokesRef.current.filter(s => !s.isFill);
                if (lineStrokes.length === 0) return;

                let targetStroke = null;
                let minDistance = Infinity;

                lineStrokes.forEach(stroke => {
                    const avgPos = stroke.points.reduce((acc, p) => ({
                        x: acc.x + p.x,
                        y: acc.y + p.y,
                        z: acc.z + p.z
                    }), {x:0, y:0, z:0});

                    avgPos.x /= stroke.points.length;
                    avgPos.y /= stroke.points.length;
                    avgPos.z /= stroke.points.length;

                    const dist = clickPoint.distanceTo(new THREE.Vector3(avgPos.x, avgPos.y, avgPos.z));

                    if (dist < minDistance) {
                        minDistance = dist;
                        targetStroke = stroke;
                    }
                });

                if (!targetStroke) return;

                const planeMatrix = new THREE.Matrix4().getInverse(drawingPlaneRef.current.matrixWorld);
                const localPoints = targetStroke.points.map(p => new THREE.Vector3(p.x, p.y, p.z).applyMatrix4(planeMatrix));

                const shape = new THREE.Shape();
                shape.moveTo(localPoints[0].x, localPoints[0].y);
                localPoints.slice(1).forEach(p => shape.lineTo(p.x, p.y));
                shape.closePath();

                const fillMesh = new THREE.Mesh(
                    new THREE.ShapeGeometry(shape),
                    new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
                );

                fillMesh.applyMatrix4(drawingPlaneRef.current.matrixWorld);
                sceneRef.current.add(fillMesh);
                drawingLinesRef.current.push(fillMesh);

                strokesRef.current.push({
                    isFill: true,
                    color,
                    planeMatrixWorld: drawingPlaneRef.current.matrixWorld.toArray(),
                    localPoints: localPoints.map(p => ({ x: p.x, y: p.y })),
                    points: targetStroke.points
                });

                setLineCount(drawingLinesRef.current.length);
                updateOrbitTarget();
            };

            const handlePointerDown = (e) => {
                if (e.target.closest('.no-canvas-touch')) return;

                const point = getMouse3D(e);
                if (!point) return;

                if (modeRef.current === 'draw') {
                    setIsDrawing(true);
                    currentPathRef.current = [point];
                }
                else if (modeRef.current === 'fill') {
                    executeFill(point);
                }
            };

            const handlePointerMove = (e) => {
                if (!isDrawing) return;
                const newPoint = getMouse3D(e);
                if (!newPoint || newPoint.distanceTo(currentPathRef.current[currentPathRef.current.length - 1]) < 0.05) return;
                currentPathRef.current.push(newPoint);
                if (drawingLinesRef.current.tempLine) sceneRef.current.remove(drawingLinesRef.current.tempLine);

                let mesh;
                if (brushTypeRef.current === 'tube') {
                    const curve = new THREE.CatmullRomCurve3(currentPathRef.current);
                    mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, currentPathRef.current.length * 2, brushSize, 8, false), new THREE.MeshPhongMaterial({ color, shininess: 80 }));
                } else if (brushTypeRef.current === 'pen') {
                    const geo = createPenGeometry(currentPathRef.current, brushSize);
                    mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
                } else {
                    const geo = createPencilGeometry(currentPathRef.current);
                    mesh = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, linewidth: 1 }));
                }

                sceneRef.current.add(mesh);
                drawingLinesRef.current.tempLine = mesh;
            };

            const handlePointerUp = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                if (drawingLinesRef.current.tempLine) {
                    drawingLinesRef.current.push(drawingLinesRef.current.tempLine);
                    drawingLinesRef.current.tempLine = null;
                    strokesRef.current.push({ isFill: false, color, brushSize, brushType: brushTypeRef.current, points: currentPathRef.current.map(p => ({ x: p.x, y: p.y, z: p.z })) });
                    setLineCount(drawingLinesRef.current.length);
                    updateOrbitTarget();
                }
                currentPathRef.current = [];
            };

            const undo = () => {
                const last = drawingLinesRef.current.pop();
                if (last) { sceneRef.current.remove(last); strokesRef.current.pop(); setLineCount(drawingLinesRef.current.length); updateOrbitTarget(); }
            };

            const savePNG = () => {
                const link = document.createElement("a");
                link.href = rendererRef.current.domElement.toDataURL("image/png");
                link.download = `hero-sketch-${Date.now()}.png`;
                link.click();
            };

            return (
                <div className="relative h-screen w-screen overflow-hidden bg-slate-50 no-select">
                    
                    {/* 📱 トップヘッダーエリア (要素の衝突を防ぐグリッド/フレックス構造) */}
                    <div className="absolute top-0 left-0 w-full z-40 p-4 md:p-6 flex items-center justify-between no-canvas-touch pointer-events-none pt-[calc(16px+env(safe-area-inset-top))] px-[calc(16px+env(safe-area-inset-left))]">
                        
                        {/* 左側: ブランドロゴと開閉ボタン */}
                        <div className="flex items-center gap-2 pointer-events-auto bg-white/40 backdrop-blur-md p-1.5 rounded-2xl border border-slate-200/40 shadow-sm">
                            <div className="bg-slate-900 text-white px-2.5 py-1 rounded-xl font-black text-xs md:text-sm shadow-md">3D</div>
                            <h1 className="text-slate-800 font-bold text-xs md:text-sm hidden sm:block pr-1">Sketch Studio</h1>
                            
                            {/* おしゃれなアニメーションハンバーガーボタン */}
                            <button 
                                onClick={() => setShowControls(!showControls)} 
                                className="md:hidden flex items-center justify-center bg-white border border-slate-200 w-8 h-8 rounded-xl shadow-sm active:scale-95 transition-transform"
                                aria-label="Menu"
                            >
                                <div className={`menu-icon relative w-5 h-6 ${showControls ? 'open' : ''}`}>
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </button>
                        </div>

                        {/* 中央: オブジェクトインジケータ */}
                        <div className="text-[9px] md:text-[10px] font-black text-slate-500 tracking-widest uppercase bg-white/80 border border-slate-200/60 px-3 py-1.5 rounded-full shadow-sm pointer-events-auto">
                            Objects: {lineCount.toString().padStart(3, '0')}
                        </div>

                        {/* 右側: 戻るボタン */}
                        <button 
                            onClick={() => window.location.href = 'index.html'} 
                            className="pointer-events-auto px-3.5 py-2 border-none rounded-xl bg-slate-900 text-white text-[10px] md:text-xs font-black tracking-wider shadow-lg active:scale-95 transition-all hover:opacity-90"
                        >
                            ← AIverse
                        </button>
                    </div>

                    {/* コントロールサイドパネル（上から滑らかに出てくるドロップダウンアニメーション） */}
                    <div className={`no-canvas-touch absolute top-[calc(68px+env(safe-area-inset-top))] left-4 md:top-24 md:left-6 w-[calc(100%-32px)] sm:w-56 max-h-[calc(100vh-160px)] md:max-h-none overflow-y-auto bg-white/95 backdrop-blur-md border rounded-3xl p-5 z-30 shadow-2xl transition-all duration-300 ease-out origin-top ${showControls ? 'translate-y-0 opacity-100 pointer-events-auto scale-100' : '-translate-y-4 opacity-0 pointer-events-none scale-95 md:translate-y-0 md:opacity-100 md:pointer-events-auto md:scale-100'}`}>
                        <div className="space-y-5">
                            <div>
                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-1.5 tracking-wider">Brush Type</label>
                                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                                    <button onClick={() => setBrushType('tube')} className={`py-2 rounded-lg text-[10px] font-black tracking-wider transition-all ${brushType === 'tube' ? 'bg-slate-900 text-white shadow' : 'text-slate-400 hover:text-slate-600'}`}>TUBE</button>
                                    <button onClick={() => setBrushType('pen')} className={`py-2 rounded-lg text-[10px] font-black tracking-wider transition-all ${brushType === 'pen' ? 'bg-slate-900 text-white shadow' : 'text-slate-400 hover:text-slate-600'}`}>PEN</button>
                                </div>
                            </div>

                            <div className={brushType === 'pencil' ? 'opacity-30 pointer-events-none transition-opacity' : 'transition-opacity'}>
                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-1.5 tracking-wider">Brush Size</label>
                                <input type="range" min="0.02" max="0.6" step="0.01" value={brushSize} onChange={(e) => setBrushSize(parseFloat(e.target.value))} className="w-full h-1.5 bg-slate-200 rounded-full appearance-none cursor-pointer" />
                            </div>

                            <div>
                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-1.5 tracking-wider">Pick Color</label>
                                <div className="color-input-wrapper mb-3" style={{ backgroundColor: color }}>
                                    <input type="color" value={color} onChange={(e) => setColor(e.target.value)} />
                                </div>
                                <div className="grid grid-cols-4 gap-2">
                                    {['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#8b5cf6', '#0f172a', '#ffffff'].map(c => (
                                        <button key={c} onClick={() => setColor(c)} className={`h-7 rounded-md border-2 ${color === c ? 'border-slate-800 scale-110' : 'border-transparent opacity-70'}`} style={{ backgroundColor: c }} />
                                    ))}
                                </div>
                            </div>

                            <div className="pt-3 border-t flex flex-col gap-2">
                                <button
                                    onClick={() => setBrushType('pencil')}
                                    className={`py-2.5 rounded-xl text-[10px] font-black tracking-widest transition-all flex items-center justify-center gap-2 border ${brushType === 'pencil' ? 'bg-slate-800 text-white border-transparent shadow-md' : 'text-slate-500 border-slate-200 hover:bg-slate-100'}`}
                                >
                                    <i data-lucide="pencil" className="w-3 h-3"></i> PENCIL
                                </button>

                                <button onClick={undo} className="py-2 text-slate-500 rounded-xl text-[10px] font-black tracking-widest hover:bg-slate-100 transition-colors mt-1">UNDO</button>
                                <button onClick={() => {drawingLinesRef.current.forEach(l => sceneRef.current.remove(l)); drawingLinesRef.current=[]; strokesRef.current=[]; setLineCount(0); updateOrbitTarget();}} className="py-2 text-slate-500 rounded-xl text-[10px] font-black tracking-widest hover:bg-red-50 hover:text-red-500 transition-colors">CLEAR</button>
                                <button onClick={savePNG} className="py-2 text-slate-500 rounded-xl text-[10px] font-black tracking-widest hover:bg-amber-50 hover:text-amber-600 transition-colors">PNG</button>
                            </div>
                        </div>
                    </div>

                    {/* 下部モード切り替えバー */}
                    <div className="no-canvas-touch absolute bottom-6 md:bottom-8 left-1/2 -translate-x-1/2 z-30 flex bg-slate-900/90 backdrop-blur-lg p-1.5 rounded-3xl shadow-2xl max-w-[95vw] mb-[env(safe-area-inset-bottom)]">
                        <button onClick={() => setMode('draw')} className={`flex items-center gap-2 px-4 py-2.5 md:px-6 md:py-3 rounded-2xl text-[11px] md:text-xs font-black transition-all ${mode === 'draw' ? 'bg-white text-slate-900 shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                            <i data-lucide="pen-tool" className="w-3.5 h-3.5"></i>DRAW
                        </button>
                        <button onClick={() => setMode('rotate')} className={`flex items-center gap-2 px-4 py-2.5 md:px-6 md:py-3 rounded-2xl text-[11px] md:text-xs font-black transition-all ${mode === 'rotate' ? 'bg-indigo-500 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                            <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${mode === 'rotate' ? 'animate-spin-slow' : ''}`}></i>VIEW
                        </button>
                        <button onClick={() => setMode('fill')} className={`flex items-center gap-2 px-4 py-2.5 md:px-6 md:py-3 rounded-2xl text-[11px] md:text-xs font-black transition-all ${mode === 'fill' ? 'bg-white text-slate-900 shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                            <span>🪣</span>FILL
                        </button>
                    </div>

                    {/* メイン3Dキャンバスコンテナ */}
                    <div 
                        className={`w-full h-full ${mode === 'draw' ? 'cursor-crosshair' : mode === 'fill' ? 'cursor-copy' : 'cursor-grab'}`} 
                        onPointerDown={handlePointerDown} 
                        onPointerMove={handlePointerMove} 
                        onPointerUp={handlePointerUp} 
                        onPointerLeave={handlePointerUp}
                        style={{ touchAction: 'none' }}
                    >
                        <div ref={mountRef} className="w-full h-full" />
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
